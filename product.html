<!--
  product.html — the PRODUCT DETAIL page.
  It reads the product id from the web address (for example product.html?id=3)
  and shows that one product's details with an "Add to cart" button.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product - Roomwise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html"><h1>🏠 Roomwise</h1></a>
    <a href="cart.html">🛒 Cart (<span id="cart-count">0</span>)</a>
  </header>

  <main>
    <p><a href="index.html">← Back to catalog</a></p>
    <!-- The product details get added in here by JavaScript -->
    <div class="detail" id="product-detail"></div>
  </main>

  <script src="products.js"></script>
  <script src="cart.js"></script>
  <script>
    // Get the "id" number from the web address
    const params = new URLSearchParams(window.location.search);
    const id = Number(params.get("id"));
    const product = findProduct(id);
    const box = document.getElementById("product-detail");

    if (!product) {
      box.innerHTML = "<p>Sorry, that product was not found.</p>";
    } else {
      document.title = product.name + " - Roomwise";
      box.innerHTML =
        // The big product picture
        '<img class="product-img big" src="' + product.image + '" alt="' + product.name + '">' +
        '<h2>' + product.name + '</h2>' +
        '<p class="room-tag">Room: ' + product.room + '</p>' +
        '<p>' + product.description + '</p>' +
        '<p class="price">$' + product.price.toFixed(2) + '</p>' +
        '<button class="btn" onclick="addToCart(' + product.id + ')">Add to cart</button>';
    }
  </script>
</body>
</html>
